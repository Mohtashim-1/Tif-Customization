<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ title or "Feedback" }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/awesomplete@1.1.5/awesomplete.min.css">
<script src="https://cdn.jsdelivr.net/npm/awesomplete@1.1.5/awesomplete.min.js"></script>
<style>
html, body { direction: ltr; text-align: left; }
body { margin: 0; background: #f5f3ee; color: #1d2230; font-family: "Figtree", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, textarea, select { font-family: inherit; direction: ltr; text-align: left; unicode-bidi: isolate; }
.wrap { max-width: 880px; margin: 0 auto; padding: 28px 24px 64px; }
.card { background: #fffdf9; border: 1px solid #e6e1d6; border-radius: 14px; padding: 22px 24px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.accent { border-top: 4px solid var(--accent, #2f5bd3); }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent, #2f5bd3); }
h1 { margin: 8px 0 0; font-family: "Newsreader", Georgia, serif; font-size: 28px; font-weight: 600; line-height: 1.2; }
.intro { margin: 8px 0 0; font-size: 15px; color: #4a4f5c; line-height: 1.5; }
.q { background: #fffdf9; border: 1px solid #e6e1d6; border-radius: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.q.bad { border-color: #e3a08c; }
.prompt { display: flex; gap: 10px; align-items: baseline; font-size: 16px; font-weight: 600; line-height: 1.4; }
.num { font-size: 13px; font-weight: 700; color: #9a9ea8; }
.star { color: #b3401f; }
.rates, .yn { display: flex; gap: 6px; flex-wrap: wrap; }
.rates button, .yn button { min-width: 44px; height: 44px; border-radius: 9px; border: 1px solid #d9d3c6; background: #fff; color: #1d2230; font-size: 15px; font-weight: 600; cursor: pointer; }
.yn button { min-width: 96px; border-radius: 10px; font-size: 14px; }
.rates button.on, .yn button.on { background: var(--accent, #2f5bd3); border-color: var(--accent, #2f5bd3); color: #fff; }
.caption { font-size: 12px; color: #9a9ea8; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choices button { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; border: 1px solid #e6e1d6; background: #fff; border-radius: 10px; padding: 12px 14px; min-height: 44px; cursor: pointer; font-size: 14px; color: #1d2230; }
.choices button.on { border-color: var(--accent, #2f5bd3); background: #fbfaf6; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #c9c2b3; box-shadow: inset 0 0 0 3px #fff; background: #fff; flex: none; }
.choices button.on .dot { border-color: var(--accent, #2f5bd3); background: var(--accent, #2f5bd3); }
textarea, input[type=text], select { width: 100%; border: 1px solid #d9d3c6; background: #fff; border-radius: 10px; padding: 12px 14px; font-size: 15px; line-height: 1.5; direction: ltr !important; text-align: left !important; unicode-bidi: plaintext; }
#customerQuery { direction: ltr !important; text-align: left !important; unicode-bidi: isolate; }
textarea { resize: vertical; }
textarea:focus, button:focus-visible, input:focus, select:focus { outline: 2px solid var(--accent, #2f5bd3); outline-offset: 1px; }
.err { font-size: 12px; font-weight: 600; color: #b3401f; }
.row { display: flex; gap: 12px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.progress { font-size: 13px; color: #6b6f7a; }
.submit { border: 0; background: var(--accent, #2f5bd3); color: #fff; border-radius: 10px; padding: 12px 22px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 44px; }
.ghost { border: 1px solid #d9d3c6; background: #fff; color: #1d2230; border-radius: 9px; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
.thanks { text-align: center; padding: 48px 28px; }
.thanks h2 { margin: 0; font-family: "Newsreader", Georgia, serif; font-size: 30px; font-weight: 600; }
.thanks p { margin: 12px auto 0; max-width: 480px; color: #4a4f5c; line-height: 1.5; }
.empty { border: 1px dashed #d0c9ba; border-radius: 14px; padding: 32px; text-align: center; color: #6b6f7a; }
.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin-top: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b6f7a; }
.field.span2 { grid-column: 1 / -1; }
.field.bad input, .field.bad select { border-color: #e3a08c; }
.linkish { border: 0; background: none; color: var(--accent, #7a4cc2); font-size: 13px; font-weight: 700; cursor: pointer; padding: 0; text-align: left; }
.soa { margin-top: 14px; padding-top: 14px; border-top: 1px solid #e6e1d6; }
.soa-title { font-size: 14px; font-weight: 700; color: #1d2230; margin-bottom: 4px; }
.note { font-size: 13px; color: #6b6f7a; line-height: 1.45; margin: 0 0 10px; }
.qr-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 18px; }
.qr { width: 220px; height: 220px; border-radius: 12px; border: 1px solid #e6e1d6; background: #fff; padding: 8px; }
.share-row { display: flex; gap: 8px; width: 100%; max-width: 520px; }
.share-row input { flex: 1; }
.ac-wrap { position: relative; }
.link-field { position: relative; direction: ltr; }
.link-field input {
	width: 100%;
	border: 1px solid #d9d3c6;
	background: #fff;
	border-radius: 10px;
	padding: 12px 36px 12px 14px;
	font-size: 15px;
	line-height: 1.5;
	direction: ltr !important;
	text-align: left !important;
	unicode-bidi: isolate;
}
.link-field .link-clear {
	position: absolute;
	right: 10px;
	top: 50%;
	transform: translateY(-50%);
	border: 0;
	background: transparent;
	color: #6b6f7a;
	font-size: 18px;
	line-height: 1;
	cursor: pointer;
	padding: 4px 6px;
	display: none;
}
.link-field.has-value .link-clear { display: inline-block; }
.awesomplete { width: 100%; display: block; }
.awesomplete > ul {
	z-index: 50;
	border: 1px solid #e6e1d6;
	border-radius: 10px;
	box-shadow: 0 10px 28px rgba(29,34,48,.12);
	background: #fff;
	max-height: 280px;
	overflow: auto;
	margin: 4px 0 0;
	padding: 4px 0;
	left: 0;
	right: 0;
	min-width: 100%;
}
.awesomplete > ul > li {
	padding: 10px 14px;
	font-size: 14px;
	color: #1d2230;
	border-bottom: 1px solid #f0ebe3;
	direction: ltr;
	text-align: left;
}
.awesomplete > ul > li[aria-selected="true"],
.awesomplete > ul > li:hover { background: #f5f0ff; }
.awesomplete mark { background: transparent; font-weight: 700; color: #7a4cc2; }
.link-desc { display: block; font-size: 12px; color: #6b6f7a; margin-top: 2px; }
.picked { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: #eef8f1; border: 1px solid #b7dfc4; font-size: 13px; color: #146c3a; font-weight: 600; direction: ltr; text-align: left; }
.picked button { border: 0; background: transparent; color: #146c3a; font-weight: 700; cursor: pointer; font-size: 12px; }
@media (max-width: 640px) { .meta-grid { grid-template-columns: 1fr; } .share-row { flex-direction: column; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const TOKEN = {{ token | tojson }};
const CSRF = {{ csrf_token | tojson }};
const SME_BOOTSTRAP = {{ sme_bootstrap | tojson }};
const API = "/api/method/tif_customization.tif_customization.api.feedback_studio.";
const app = document.getElementById("app");
const state = {
	form: null,
	answers: {},
	errors: {},
	metaErrors: {},
	submitted: false,
	status: TOKEN ? "loading" : "missing",
	smeName: "",
	customer: "",
	customerLabel: "",
	customerQuery: "",
	schoolHits: [],
	schoolOpen: false,
	schoolSearching: false,
	schoolTimer: null,
	createSchool: false,
	schoolOpening: {
		school_name: "",
		city: "",
		area: "",
		province: "",
		address: "",
		school_mobile: "",
		school_email: "",
		principal_name: "",
		principal_cell: "",
		visit_type: "Visit with enrollment"
	},
	shareResult: null,
	shareCopied: false
};

function esc(value) {
	return String(value == null ? "" : value)
		.replace(/&/g, "&amp;")
		.replace(/</g, "&lt;")
		.replace(/>/g, "&gt;")
		.replace(/"/g, "&quot;");
}

function isSme() {
	if (SME_BOOTSTRAP) return true;
	return !!(state.form && state.form.audience === "sme");
}

function smeData() {
	return (state.form && state.form.sme) || SME_BOOTSTRAP || {};
}

function qrImg(url) {
	return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=" + encodeURIComponent(url || "");
}

function clientMeta() {
	const nav = window.navigator || {};
	const scr = window.screen || {};
	const conn = nav.connection || nav.mozConnection || nav.webkitConnection || {};
	return {
		platform: nav.platform || "",
		language: nav.language || "",
		languages: Array.isArray(nav.languages) ? nav.languages.slice(0, 8) : [],
		timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone) || "",
		timezoneOffset: new Date().getTimezoneOffset(),
		screenWidth: scr.width || 0,
		screenHeight: scr.height || 0,
		availWidth: scr.availWidth || 0,
		availHeight: scr.availHeight || 0,
		colorDepth: scr.colorDepth || 0,
		pixelRatio: window.devicePixelRatio || 1,
		viewportWidth: window.innerWidth || 0,
		viewportHeight: window.innerHeight || 0,
		touchPoints: nav.maxTouchPoints || 0,
		cookieEnabled: !!nav.cookieEnabled,
		doNotTrack: nav.doNotTrack || "",
		hardwareConcurrency: nav.hardwareConcurrency || 0,
		deviceMemory: nav.deviceMemory || 0,
		connectionType: conn.effectiveType || "",
		connectionDownlink: conn.downlink || 0,
		referrer: document.referrer || "",
		pageUrl: location.href || "",
		online: !!nav.onLine,
		macAddress: ""
	};
}

function searchLink(doctype, txt) {
	const url = API + "search_public_link?token=" + encodeURIComponent(TOKEN) +
		"&doctype=" + encodeURIComponent(doctype) +
		"&txt=" + encodeURIComponent(txt || "") +
		"&limit=40";
	return fetch(url, { headers: { Accept: "application/json" } })
		.then(function (res) { return res.json(); })
		.then(function (data) { return Array.isArray(data.message) ? data.message : []; });
}

function LinkField(opts) {
	this.doctype = opts.doctype;
	this.placeholder = opts.placeholder || ("Search " + opts.doctype + "...");
	this.mount = typeof opts.mount === "string" ? document.getElementById(opts.mount) : opts.mount;
	this.value = opts.value || "";
	this.label = opts.label || opts.value || "";
	this.onChange = opts.onChange || function () {};
	this.disabled = !!opts.disabled;
	this._timer = null;
	this._seq = 0;
	this.render();
}

LinkField.prototype.render = function () {
	if (!this.mount) return;
	this.mount.innerHTML =
		'<div class="link-field' + (this.value ? " has-value" : "") + (this.disabled ? " is-disabled" : "") + '">' +
		'<input type="text" dir="ltr" lang="en" autocomplete="off" spellcheck="false" placeholder="' + esc(this.placeholder) + '"' +
		(this.disabled ? " disabled" : "") + ' value="' + esc(this.label || this.value || "") + '">' +
		'<button type="button" class="link-clear" title="Clear" aria-label="Clear">&times;</button></div>';
	this.input = this.mount.querySelector("input");
	this.clearBtn = this.mount.querySelector(".link-clear");
	const me = this;
	this.clearBtn.onclick = function (e) {
		e.preventDefault();
		me.setValue("", "");
		me.input.focus();
	};
	if (this.disabled) return;
	if (typeof Awesomplete === "undefined") {
		this.input.oninput = function () {
			me.value = "";
			me.label = me.input.value;
			me.mount.querySelector(".link-field").classList.toggle("has-value", !!me.input.value);
		};
		return;
	}
	this.awesomplete = new Awesomplete(this.input, {
		minChars: 0,
		maxItems: 40,
		autoFirst: true,
		tabSelect: true,
		filter: function () { return true; },
		sort: false,
		item: function (text) {
			// `text` is the HTML label from data() — only for dropdown display
			const li = document.createElement("li");
			li.innerHTML = typeof text === "string" ? text : String((text && text.label) || text || "");
			return li;
		},
		replace: function (suggestion) {
			// IMPORTANT: never put HTML into the input — only the plain link value
			const plain = plainText(
				(suggestion && suggestion.value) ||
				(typeof suggestion === "string" ? suggestion : "") ||
				""
			);
			me.input.value = plain;
		},
		data: function (item) {
			const value = plainText(item.value || item.label || "");
			const title = plainText(item.label || item.value || "");
			const desc = plainText(item.description || "");
			const html = '<span class="link-title">' + esc(title) + "</span>" +
				(desc ? '<span class="link-desc">' + esc(desc) + "</span>" : "");
			return { label: html, value: value };
		}
	});
	this.input.addEventListener("awesomplete-selectcomplete", function (e) {
		let val = "";
		if (e.text && typeof e.text === "object") {
			val = e.text.value || "";
		} else if (typeof e.text === "string") {
			val = e.text;
		}
		val = plainText(val || me.input.value || "");
		me.input.value = val;
		me.setValue(val, val);
	});
	this.input.addEventListener("input", function () {
		// Guard against HTML ever landing in the box
		if (/[<>]/.test(me.input.value)) {
			me.input.value = plainText(me.input.value);
		}
		me.mount.querySelector(".link-field").classList.toggle("has-value", !!me.input.value);
		if (me.value && me.input.value !== me.label) {
			me.value = "";
			me.label = me.input.value;
			me.onChange("", me.input.value);
		}
		me.queueSearch(me.input.value);
	});
	this.input.addEventListener("focus", function () {
		me.queueSearch(me.input.value);
	});
	this.input.addEventListener("blur", function () {
		if (/[<>]/.test(me.input.value)) {
			me.input.value = plainText(me.input.value);
		}
	});
};

function plainText(value) {
	return String(value == null ? "" : value)
		.replace(/<[^>]*>/g, " ")
		.replace(/&nbsp;/g, " ")
		.replace(/&amp;/g, "&")
		.replace(/&lt;/g, "<")
		.replace(/&gt;/g, ">")
		.replace(/&quot;/g, '"')
		.replace(/\s+/g, " ")
		.trim();
}

LinkField.prototype.queueSearch = function (txt) {
	const me = this;
	clearTimeout(this._timer);
	const seq = ++this._seq;
	this._timer = setTimeout(function () {
		searchLink(me.doctype, plainText(txt)).then(function (rows) {
			if (seq !== me._seq || !me.awesomplete) return;
			me.awesomplete.list = rows;
			if (me.input === document.activeElement) me.awesomplete.evaluate();
		}).catch(function () {
			if (seq !== me._seq || !me.awesomplete) return;
			me.awesomplete.list = [];
		});
	}, 200);
};

LinkField.prototype.setValue = function (value, label) {
	this.value = plainText(value || "");
	this.label = plainText(label || value || "");
	if (this.input) this.input.value = this.label;
	if (this.mount) {
		const wrap = this.mount.querySelector(".link-field");
		if (wrap) wrap.classList.toggle("has-value", !!this.value || !!this.label);
	}
	this.onChange(this.value, this.label);
};

LinkField.prototype.getValue = function () {
	return this.value || "";
};

function smeMetaHtml() {
	const soa = state.schoolOpening;
	const provinces = ((smeData().provinces) || []).map(function (p) {
		return '<option value="' + esc(p) + '"' + (soa.province === p ? " selected" : "") + ">" + esc(p) + "</option>";
	}).join("");
	const createPanel = state.createSchool
		? '<div class="soa"><div class="soa-title">School Opening - create school</div><p class="note">School is not in Customer yet. This creates a School Opening request (same as Easy Form).</p><div class="meta-grid">' +
			'<label class="field' + (state.metaErrors.school_name ? " bad" : "") + '"><span>Name of School *</span><input type="text" data-key="soa-school_name" data-soa="school_name" dir="ltr" value="' + esc(soa.school_name || "") + '"></label>' +
			'<label class="field"><span>City</span><input type="text" data-key="soa-city" data-soa="city" dir="ltr" value="' + esc(soa.city || "") + '"></label>' +
			'<label class="field"><span>Area</span><input type="text" data-key="soa-area" data-soa="area" dir="ltr" value="' + esc(soa.area || "") + '"></label>' +
			'<label class="field"><span>Province</span><select data-soa="province"><option value="">Select...</option>' + provinces + "</select></label>" +
			'<label class="field span2"><span>Address</span><input type="text" data-key="soa-address" data-soa="address" dir="ltr" value="' + esc(soa.address || "") + '"></label>' +
			'<label class="field"><span>School mobile</span><input type="text" data-key="soa-mobile" data-soa="school_mobile" dir="ltr" value="' + esc(soa.school_mobile || "") + '"></label>' +
			'<label class="field"><span>School email</span><input type="text" data-key="soa-email" data-soa="school_email" dir="ltr" value="' + esc(soa.school_email || "") + '"></label>' +
			'<label class="field"><span>Principal name</span><input type="text" data-key="soa-pname" data-soa="principal_name" dir="ltr" value="' + esc(soa.principal_name || "") + '"></label>' +
			'<label class="field"><span>Principal cell</span><input type="text" data-key="soa-pcell" data-soa="principal_cell" dir="ltr" value="' + esc(soa.principal_cell || "") + '"></label>' +
			"</div></div>"
		: "";
	return '<div class="card" id="smeMetaCard" style="border:2px solid #7a4cc2"><div class="kicker">SME + School (required)</div>' +
		'<p class="note">Both fields work like Frappe <strong>Link</strong> fields. SME links to <strong>Field Officer</strong>. School links to <strong>Customer</strong>.</p><div class="meta-grid">' +
		'<label class="field' + (state.metaErrors.smeName ? " bad" : "") + '"><span>SME name (Field Officer) *</span><div id="smeLinkMount"></div>' +
		(state.metaErrors.smeName ? '<div class="err">Required — pick a Field Officer</div>' : "") +
		"</label>" +
		'<label class="field span2' + (state.metaErrors.customer ? " bad" : "") + '"><span>Customer / school *</span><div id="customerLinkMount"></div>' +
		(state.metaErrors.customer ? '<div class="err">Required — pick a Customer from suggestions</div>' : "") +
		"</label></div>" +
		'<div style="margin-top:12px"><button type="button" class="linkish" id="toggleCreate">' +
		(state.createSchool ? "Cancel new school" : "School not listed? Create with School Opening") +
		"</button></div>" + createPanel + "</div>";
}

function bindSmeMeta() {
	state._smeLink = new LinkField({
		doctype: "Field Officer",
		mount: "smeLinkMount",
		placeholder: "Search Field Officer...",
		value: state.smeName || "",
		label: state.smeName || "",
		onChange: function (value) {
			state.smeName = value || "";
			if (value) delete state.metaErrors.smeName;
		}
	});
	state._customerLink = new LinkField({
		doctype: "Customer",
		mount: "customerLinkMount",
		placeholder: "Search Customer / school...",
		value: state.customer || "",
		label: state.customerLabel || state.customer || "",
		disabled: state.createSchool,
		onChange: function (value, label) {
			state.customer = value || "";
			state.customerLabel = label || value || "";
			state.customerQuery = state.customerLabel;
			if (value) {
				state.createSchool = false;
				delete state.metaErrors.customer;
			}
		}
	});
	const toggle = document.getElementById("toggleCreate");
	if (toggle) toggle.onclick = function () {
		state.createSchool = !state.createSchool;
		if (state.createSchool) {
			state.customer = "";
			state.customerLabel = "";
			state.customerQuery = (state._customerLink && state._customerLink.input && state._customerLink.input.value) || "";
			if (!state.schoolOpening.school_name && state.customerQuery) {
				state.schoolOpening.school_name = state.customerQuery;
			}
			delete state.metaErrors.customer;
		}
		render();
	};
	app.querySelectorAll("[data-soa]").forEach(function (el) {
		const apply = function () {
			state.schoolOpening[el.dataset.soa] = el.value;
			if (el.dataset.soa === "school_name") delete state.metaErrors.school_name;
		};
		el.addEventListener(el.tagName === "SELECT" ? "change" : "input", apply);
	});
}

function render() {
	const active = document.activeElement;
	let key = null, start = null, end = null;
	if (active && app.contains(active) && active.dataset && active.dataset.key) {
		key = active.dataset.key;
		start = active.selectionStart;
		end = active.selectionEnd;
	}
	if (state.status === "loading") {
		if (isSme()) {
			app.style.setProperty("--accent", "#7a4cc2");
			app.innerHTML = '<div class="stack">' + smeMetaHtml() + '<div class="empty">Loading questions...</div></div>';
			bindSmeMeta();
			return;
		}
		app.innerHTML = '<div class="empty">Loading the form…</div>';
		return;
	}
	if (state.status === "missing" || state.status === "invalid") {
		app.innerHTML = '<div class="card"><h1>This link is not valid</h1><p class="intro">Ask the school for a new feedback link.</p></div>';
		return;
	}
	const form = state.form;
	app.style.setProperty("--accent", form.color || "#2f5bd3");
	if (state.submitted) {
		if (isSme() && state.shareResult && state.shareResult.share_url) {
			const share = state.shareResult;
			const url = share.share_url;
			app.innerHTML = '<div class="card accent thanks"><h2>Thank you</h2><p>Your SME feedback is saved. Share this QR or link with parents, the school, or students.</p>' +
				(share.school_name ? '<p class="note">School: <strong>' + esc(share.school_name) + "</strong></p>" : "") +
				(share.school_opening ? '<p class="note">School Opening created: ' + esc(share.school_opening) + "</p>" : "") +
				'<div class="qr-wrap"><img class="qr" src="' + esc(qrImg(url)) + '" width="220" height="220" alt="QR">' +
				'<div class="share-row"><input id="shareUrl" readonly value="' + esc(url) + '"><button type="button" class="submit" id="copyShare">' + (state.shareCopied ? "Copied" : "Copy link") + "</button></div>" +
				'<a class="linkish" href="' + esc(url) + '" target="_blank" rel="noopener">Open link</a></div>' +
				'<div class="row" style="justify-content:center;margin-top:16px"><button type="button" class="ghost" id="again">Submit another</button></div></div>';
			document.getElementById("again").onclick = resetForm;
			document.getElementById("copyShare").onclick = function () {
				const input = document.getElementById("shareUrl");
				const done = function () {
					state.shareCopied = true;
					render();
					setTimeout(function () { state.shareCopied = false; if (state.submitted) render(); }, 1400);
				};
				if (navigator.clipboard && navigator.clipboard.writeText) {
					navigator.clipboard.writeText(url).then(done).catch(function () {
						if (input) { input.focus(); input.select(); try { document.execCommand("copy"); done(); } catch (e) {} }
					});
				} else if (input) {
					input.focus(); input.select();
					try { document.execCommand("copy"); done(); } catch (e) {}
				}
			};
			return;
		}
		app.innerHTML = '<div class="card accent thanks"><h2>Thank you</h2><p>Your feedback has been recorded. It helps us improve.</p><div class="row" style="justify-content:center;margin-top:16px"><button type="button" class="ghost" id="again">Submit another</button></div></div>';
		document.getElementById("again").onclick = resetForm;
		return;
	}
	const scale = Number(form.ratingScale) === 10 ? 10 : 5;
	const cards = (form.questions || []).map(function (q, i) {
		const val = state.answers[q.id];
		const bad = !!state.errors[q.id];
		let control = "";
		if (q.type === "rating") {
			let buttons = "";
			for (let n = 1; n <= scale; n++) {
				buttons += '<button type="button" data-act="rate" data-id="' + esc(q.id) + '" data-val="' + n + '"' + (val === n ? ' class="on"' : "") + ">" + n + "</button>";
			}
			control = '<div class="rates">' + buttons + '</div><div class="caption">1 = Poor · ' + scale + " = Excellent</div>";
		} else if (q.type === "choice") {
			control = '<div class="choices">' + (q.options || []).map(function (o, j) {
				return '<button type="button" data-act="choice" data-id="' + esc(q.id) + '" data-j="' + j + '"' + (val === o ? ' class="on"' : "") + '><span class="dot"></span><span>' + esc(o) + "</span></button>";
			}).join("") + "</div>";
		} else if (q.type === "yesno") {
			control = '<div class="yn">' + ["Yes", "No"].map(function (o) {
				return '<button type="button" data-act="yn" data-id="' + esc(q.id) + '" data-val="' + o + '"' + (val === o ? ' class="on"' : "") + ">" + o + "</button>";
			}).join("") + "</div>";
		} else {
			control = '<textarea data-key="ans-' + esc(q.id) + '" data-id="' + esc(q.id) + '" rows="3" placeholder="Write your answer…">' + esc(val || "") + "</textarea>";
		}
		return '<div class="q' + (bad ? " bad" : "") + '"><div class="prompt"><span class="num">' + (i + 1) + '.</span><span>' + esc(q.text || "Untitled question") + (q.required ? '<span class="star"> *</span>' : "") + "</span></div>" + control + (bad ? '<div class="err">This question is required.</div>' : "") + "</div>";
	}).join("");
	const answered = (form.questions || []).filter(function (q) {
		return state.answers[q.id] !== undefined && state.answers[q.id] !== "";
	}).length;
	const empty = (form.questions || []).length ? "" : '<div class="empty">This form has no questions yet.</div>';
	const meta = isSme() ? smeMetaHtml() : "";
	app.innerHTML = '<div class="stack"><div class="card accent"><div class="kicker">' + esc(form.label) + ' feedback</div><h1>' + esc(form.title || "Feedback") + '</h1><p class="intro">' + esc(form.intro || "") + "</p></div>" + meta + cards + empty + '<div class="row"><span class="progress">' + answered + " of " + (form.questions || []).length + ' answered</span><button type="button" class="submit" id="send">Submit feedback</button></div></div>';
	if (isSme()) bindSmeMeta();
	app.querySelectorAll("[data-act]").forEach(function (btn) {
		btn.addEventListener("click", onAct);
	});
	app.querySelectorAll("textarea[data-id]").forEach(function (el) {
		el.addEventListener("input", function () {
			state.answers[el.dataset.id] = el.value;
			delete state.errors[el.dataset.id];
			const progress = app.querySelector(".progress");
			if (progress) {
				const n = (form.questions || []).filter(function (q) {
					return state.answers[q.id] !== undefined && state.answers[q.id] !== "";
				}).length;
				progress.textContent = n + " of " + (form.questions || []).length + " answered";
			}
		});
	});
	document.getElementById("send").onclick = submit;
	if (key) {
		const el = app.querySelector('[data-key="' + CSS.escape(key) + '"]');
		if (el) {
			el.focus();
			if (typeof start === "number" && el.setSelectionRange) {
				try { el.setSelectionRange(start, end); } catch (e) {}
			}
		}
	}
}

function resetForm() {
	state.submitted = false;
	state.answers = {};
	state.errors = {};
	state.metaErrors = {};
	state.shareResult = null;
	state.shareCopied = false;
	render();
}

function onAct(e) {
	const btn = e.currentTarget;
	const q = (state.form.questions || []).find(function (item) { return item.id === btn.dataset.id; });
	if (!q) return;
	let value = btn.dataset.val;
	if (btn.dataset.act === "rate") value = Number(value);
	if (btn.dataset.act === "choice") value = (q.options || [])[Number(btn.dataset.j)];
	state.answers[q.id] = value;
	delete state.errors[q.id];
	render();
}

function missing() {
	const errs = {};
	(state.form.questions || []).forEach(function (q) {
		const val = state.answers[q.id];
		if (q.required && (val === undefined || val === "")) errs[q.id] = true;
	});
	return errs;
}

function syncLinkValues() {
	if (state._smeLink) {
		state.smeName = state._smeLink.getValue() || "";
	}
	if (state._customerLink && !state.createSchool) {
		state.customer = state._customerLink.getValue() || "";
		state.customerLabel = state._customerLink.label || state.customer;
	}
}

function missingMeta() {
	const errs = {};
	if (!isSme()) return errs;
	syncLinkValues();
	if (!(state.smeName || "").trim()) errs.smeName = true;
	if (state.createSchool) {
		if (!(state.schoolOpening.school_name || "").trim()) errs.school_name = true;
	} else if (!(state.customer || "").trim()) {
		errs.customer = true;
	}
	return errs;
}

function serverMessage(data) {
	let message = "Could not submit. Please try again.";
	if (data && data._server_messages) {
		try {
			const msgs = JSON.parse(data._server_messages).map(function (item) {
				try { return JSON.parse(item).message || item; } catch (e) { return item; }
			});
			if (msgs.length) message = msgs.join(" ");
		} catch (e) {}
	}
	return message;
}

async function submit() {
	syncLinkValues();
	const metaErrs = missingMeta();
	const errs = missing();
	if (Object.keys(metaErrs).length || Object.keys(errs).length) {
		state.metaErrors = metaErrs;
		state.errors = errs;
		render();
		const bad = app.querySelector(".bad, .field.bad");
		if (bad) bad.scrollIntoView({ block: "center", behavior: "smooth" });
		return;
	}
	const button = document.getElementById("send");
	if (button) button.disabled = true;
	const body = { token: TOKEN, answers: state.answers, client_meta: clientMeta() };
	if (isSme()) {
		body.sme_name = state.smeName;
		if (state.createSchool) {
			const soa = Object.assign({}, state.schoolOpening);
			soa.tif_representative = state.smeName;
			soa.key_contacts = {
				Principal: { name: soa.principal_name || "", cell: soa.principal_cell || "" }
			};
			body.school_opening = soa;
		} else {
			body.customer = state.customer;
		}
	}
	try {
		const res = await fetch(API + "submit_public", {
			method: "POST",
			headers: {
				"Content-Type": "application/json",
				"Accept": "application/json",
				"X-Frappe-CSRF-Token": CSRF || ""
			},
			body: JSON.stringify(body)
		});
		const data = await res.json();
		if (!res.ok || (data.exc && !data.message)) {
			window.alert(serverMessage(data));
			if (button) button.disabled = false;
			return;
		}
		state.submitted = true;
		state.shareResult = data.message || null;
		state.answers = {};
		state.errors = {};
		state.metaErrors = {};
		render();
	} catch (e) {
		window.alert("Could not submit. Please try again.");
		if (button) button.disabled = false;
	}
}

async function load() {
	if (!TOKEN) {
		render();
		return;
	}
	render();
	try {
		const res = await fetch(API + "get_public_form?token=" + encodeURIComponent(TOKEN), {
			headers: { "Accept": "application/json" }
		});
		const data = await res.json();
		if (!data.message || !data.message.ok) {
			state.status = "invalid";
			render();
			return;
		}
		state.form = data.message;
		if (!state.form.sme && SME_BOOTSTRAP) state.form.sme = SME_BOOTSTRAP;
		if (state.form.sme && state.form.sme.default_sme && !state.smeName) {
			state.smeName = state.form.sme.default_sme;
		}
		state.status = "ready";
		document.title = data.message.title || "Feedback";
		render();
	} catch (e) {
		state.status = "invalid";
		render();
	}
}

load();
</script>
</body>
</html>
